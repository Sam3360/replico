name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test (offline suite, mocked GitHub)
        run: python -m pytest -q
        env:
          # Never reach out to the network during tests. GitHub Actions env
          # names are case-insensitive, so a lowercase `no_proxy` twin of
          # `NO_PROXY` would be rejected as a duplicate key.
          NO_PROXY: "*"

  quality:
    name: lint + types
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format
        run: ruff format --check src tests
      - name: Type checks
        run: mypy src/replico

  package:
    name: build + package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Validate wheel metadata
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test installed CLI
        run: replico version && replico help >/dev/null
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: replico-dist
          path: dist/
          if-no-files-found: error
